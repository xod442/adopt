<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ADOPT{% endblock %}</title>
  <link rel="stylesheet" href="{{ rp }}/assets/style.css">
  <link rel="stylesheet" href="{{ rp }}/assets/adopt.css">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <div class="brand-group">
      <img class="hpe-logo" src="{{ rp }}/assets/hpelogo.png" alt="HPE">
      <div class="brand">ADOP<span>T</span> <small>CX Switch Mist Adoption</small></div>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
