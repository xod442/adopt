name: adopt

services:
  adopt:
    build: .
    image: adopt
    environment:
      - ADOPT_DB_PATH=/data/adopt.db
      # Subpath when served behind the edge, e.g. /adopt. Empty = root.
      - ADOPT_ROOT_PATH=${ADOPT_ROOT_PATH:-}
      - ADOPT_MIST_HOST=${ADOPT_MIST_HOST:-api.mist.com}
      - ADOPT_AOSCX_API_VERSION=${ADOPT_AOSCX_API_VERSION:-10.09}
      - ADOPT_MIST_REGISTRATION_FIELD=${ADOPT_MIST_REGISTRATION_FIELD:-registration_code}
      - ADOPT_PUSH_CONCURRENCY=${ADOPT_PUSH_CONCURRENCY:-4}
      # Test-only escape hatches — leave unset in production.
      - ADOPT_MIST_BASE_URL_OVERRIDE=${ADOPT_MIST_BASE_URL_OVERRIDE:-}
      - ADOPT_CX_SCHEME=${ADOPT_CX_SCHEME:-https}
    ports:
      - "${ADOPT_PORT:-9099}:8000"
    volumes:
      - adopt-data:/data
    restart: unless-stopped

volumes:
  adopt-data:
